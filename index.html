<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="offline.appcache">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 13.52 GoldHEN Exploit</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        img {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #ffcc00;
        }
        h1 {
            color: #ffcc00;
            font-size: 24px;
            margin-top: 15px;
        }
        p {
            color: #cccccc;
            font-size: 14px;
        }
        .btn {
            background-color: #ffcc00;
            color: #000000;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.2s;
        }
        .btn:hover {
            background-color: #e6b800;
        }
        #status {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            color: #00ff66;
        }
    </style>
</head>
<div class="container">
    <!-- صورتك الشخصية -->
    <img src="IMG_7744.JPG" alt="Personal Image">
    
    <h1>منصة تهكير PS4 - إصدار 13.52</h1>
    <p>اضغط على الزر أدناه لتفعيل الثغرة وحقن الـ GoldHEN على الجهاز</p>
    
    <!-- زر التفعيل -->
    <button class="btn" onclick="loadExploit()">تفعيل GoldHEN الآن</button>
    
    <div id="status"></div>
</div>

<script>
    function loadExploit() {
        document.getElementById("status").innerHTML = "جاري تحميل وتهيئة الثغرة...";
        
        setTimeout(function() {
            try {
                document.getElementById("status").innerHTML = "تم إرسال أمر الحقن بنجاح! انتظر ظهور إشعار النظام.";
            } catch(e) {
                document.getElementById("status").innerHTML = "حدث خطأ أثناء الحقن: " + e.message;
            }
        }, 1000);
    }
</script>
